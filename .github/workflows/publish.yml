name: publish

on:
  release:
    types:
      - released

# no job receives a token unless it asks for one
permissions: {}

jobs:
  # dependencies and tests run here, where no publishing credential exists
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.15"

      - name: Install
        run: uv sync --all-groups --all-extras --frozen

      - name: Lint
        run: uv run ruff check --output-format=github ./src ./tests && uv run pyright
          --project ./

      - name: Test
        run: uv run pytest --rootdir= ./tests --doctest-modules
          --junitxml=junit/test-results.xml

      - name: Build
        run: uv build

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
          retention-days: 1

  # only this job can mint the PyPI token, and it installs nothing from the
  # project - it just uploads the artifact built and tested above
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"

      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist/

      - name: Publish
        run: uv publish
