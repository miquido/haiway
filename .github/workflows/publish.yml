name: publish

on:
  release:
    types:
      - released

# no job receives a token unless it asks for one
permissions: {}

jobs:
  # dependencies and tests run here, where no publishing credential exists
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.15"

      - name: Install
        run: uv sync --all-groups --all-extras --frozen

      - name: Lint
        run: uv run bandit -q -r ./src && uv run ruff check --output-format=github ./src ./tests
          && uv run pyright --project ./

      - name: Test
        run: uv run pytest --rootdir= ./tests --doctest-modules
          --junitxml=junit/test-results.xml

  # the sdist carries the C source - installing it compiles the extension, which needs
  # a compiler
  sdist:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.15"

      - name: Build
        run: uv build --sdist

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist-sdist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  # one wheel per platform and interpreter - the extension is compiled, so a wheel
  # is only good for the one it was built on. manylinux tags come from cibuildwheel
  wheels:
    needs: verify
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      # cibuildwheel uses an external uv outside of the linux containers
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.3.5

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 1

  # only this job can mint the PyPI token, and it installs nothing from the
  # project - it just uploads the artifacts built and tested above
  publish:
    needs: [verify, sdist, wheels]
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"

      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/

      - name: Publish
        run: uv publish
