name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - "*"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.14", "3.15"]
        # the pure Python State is the default and the native one is opt-in, and the
        # same suite has to pass on each - "1" fails the install, rather than going
        # without, when the extension can't be compiled
        native: ["1", "0"]

    env:
      HAIWAY_NATIVE: ${{ matrix.native }}

    steps:
      - uses: actions/checkout@v7

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: uv sync --all-groups --all-extras --frozen

      - name: Native extension
        if: matrix.native == '1'
        run: uv run python -c "from haiway._native import NATIVE; assert NATIVE, 'not built'"

      - name: Lint
        run: uv run ruff check --output-format=github ./src ./tests && uv run pyright
          --project ./

      - name: Docs Lint (non-Windows)
        if: runner.os != 'Windows'
        run: |
          # Markdown style lint
          uv run pymarkdown --config .pymarkdown.json scan README.md docs
          # Formatting check (fails if reformatting would be needed)
          uv run mdformat --wrap 100 --check README.md docs

      - name: Test
        run: uv run pytest --rootdir= ./tests --doctest-modules
          --junitxml=junit/test-results.xml

      - name: Build
        run: uv build
