name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - "*"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      # each configuration reports on its own - one failing says nothing of the rest
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.15"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: uv sync --all-groups --all-extras --frozen

      - name: Native extension
        run: uv run python -c "from haiway._native import nstruct; assert nstruct.Struct, 'not built'"

      - name: Lint
        run: uv run ruff check --output-format=github ./src ./tests && uv run pyright
          --project ./

      - name: Docs Lint (non-Windows)
        if: runner.os != 'Windows'
        run: |
          # Markdown style lint
          uv run pymarkdown --config .pymarkdown.json scan README.md docs
          # Formatting check (fails if reformatting would be needed)
          uv run mdformat --wrap 100 --check README.md docs

      - name: Test
        run: uv run pytest --rootdir= ./tests --doctest-modules
          --junitxml=junit/test-results.xml

      - name: Build
        run: uv build
