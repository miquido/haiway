[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[project]
name = "haiway"
description = "Framework for dependency injection and state management within structured concurrency model."
version = "0.57.0"
readme = "README.md"
maintainers = [
  { name = "Kacper Kaliński", email = "kacper.kalinski@miquido.com" },
]
requires-python = ">=3.14"
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Developers",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
  "Topic :: Software Development",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
license = { file = "LICENSE" }
dependencies = ["typing-extensions~=4.16"]

[project.urls]
Homepage = "https://miquido.com"
Repository = "https://github.com/miquido/haiway.git"

[project.optional-dependencies]
opentelemetry = [
  "opentelemetry-api~=1.44",
  "opentelemetry-sdk~=1.44",
  "opentelemetry-exporter-otlp-proto-grpc~=1.44",
]
httpx = ["httpx2~=2.10"]
postgres = ["asyncpg~=0.31.0"]
rabbitmq = ["pika~=1.4",]
starlette = ["starlette~=1.6"]
# starlette is constrained explicitly - the FastAPI requirement has no upper bound
# and `haiway.fastapi` builds on top of `haiway.starlette`
fastapi = ["fastapi~=0.141", "starlette~=1.6"]
dev = [
  "bandit~=1.9",
  "pyright~=1.1",
  "pytest~=9.1",
  "pytest-asyncio~=1.4",
  "pytest-cov~=7.1",
  "ruff~=0.16",
]
docs = [
  "mkdocs~=1.6",
  "mkdocs-material~=9.7",
  "mkdocstrings[python]~=0.30",
  "mdformat~=0.7",
  "mdformat-gfm~=0.4",
  "pymarkdownlnt~=0.9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
# Test isolation relies on a fresh event loop per test - see tests/conftest.py.
# Leaving this unset also makes pytest-asyncio warn, which aborts collection
# outright under PYTHONWARNINGS=error.
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = [".venv", ".git", ".cache"]
lint.select = ["E", "F", "A", "I", "B", "PL", "W", "C", "RUF", "UP"]
lint.ignore = ["A005"]

[tool.ruff.lint.pylint]
max-args = 12

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "E402"]
"./tests/*.py" = ["PLR2004"]

[tool.pyright]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
include = ["./src"]
exclude = ["**/node_modules", "**/__pycache__"]
ignore = []
stubPath = "./stubs"
reportMissingImports = true
reportMissingTypeStubs = false
useLibraryCodeForTypes = true
typeCheckingMode = "strict"

[tool.pyrefly]
project_includes = ["./src"]
project_excludes = [
    "**/node_modules",
    "**/__pycache__",
]
python_version = "3.14"

[tool.uv-build]
packages = [{ include = "haiway", from = "src" }]

[tool.uv-build.sdist]
exclude = [
  "site",
  "docs",
  "tests",
  ".github",
  "stubs",
  "config",
  "llms.txt",
  ".vscode",
  ".claude",
  ".codex",
  ".zed",
  ".venv",
  "**/.DS_Store",
  "**/__pycache__",
  ".ruff_cache",
  ".pytest_cache",
  ".mypy_cache",
]

[tool.uv-build.wheel]
exclude = ["**/.DS_Store", "**/__pycache__", "**/*.pyc"]
