[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "haiway"
description = "Framework for dependency injection and state management within structured concurrency model."
version = "0.60.0"
readme = "README.md"
maintainers = [
  { name = "Kacper Kaliński", email = "kacper.kalinski@miquido.com" },
]
requires-python = ">=3.14"
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Developers",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Typing :: Typed",
  "Topic :: Software Development",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
license = { file = "LICENSE" }
dependencies = ["typing-extensions~=4.16"]

[project.urls]
Homepage = "https://miquido.com"
Repository = "https://github.com/miquido/haiway.git"

[project.optional-dependencies]
opentelemetry = [
  "opentelemetry-api~=1.45",
  "opentelemetry-sdk~=1.45",
  "opentelemetry-exporter-otlp-proto-grpc~=1.45",
]
httpx = ["httpx2~=2.16"]
postgres = ["asyncpg~=0.32.0"]
rabbitmq = ["pika~=1.4",]
starlette = ["starlette~=1.10"]
# starlette is constrained explicitly - the FastAPI requirement has no upper bound
# and `haiway.fastapi` builds on top of `haiway.starlette`
fastapi = ["fastapi~=0.162", "starlette~=1.10"]

[dependency-groups]
# development tooling lives in dependency groups (synced by default, never published)
# while the integration extras stay optional dependencies of the package itself
dev = [
  "haiway[opentelemetry,httpx,postgres,rabbitmq,starlette,fastapi]",
  "bandit~=1.9",
  "pyright~=1.1",
  "pytest~=9.2",
  "pytest-asyncio~=1.4",
  "pytest-cov~=7.1",
  "ruff~=0.17",
]
docs = [
  "haiway[opentelemetry,httpx,postgres,rabbitmq,starlette,fastapi]",
  "mkdocs~=1.6",
  "mkdocs-material~=9.8",
  "mkdocstrings[python]~=1.0",
  "mdformat~=1.0",
  "mdformat-gfm~=1.0",
  "pymarkdownlnt~=0.9",
]

[tool.uv]
required-version = "==0.13.7"
default-groups = "all"
cache-keys = [{ file = "pyproject.toml" }, { file = "setup.py" }, { file = "src/haiway/_native/**/*.c" }]

[tool.pytest.ini_options]
pythonpath = ["src"]
# Test isolation relies on a fresh event loop per test - see tests/conftest.py.
# Leaving this unset also makes pytest-asyncio warn, which aborts collection
# outright under PYTHONWARNINGS=error.
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = [".venv", ".git", ".cache"]
lint.select = ["E", "F", "A", "I", "B", "PL", "W", "C", "RUF", "UP"]
lint.ignore = ["A005"]

[tool.ruff.lint.pylint]
max-args = 12

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "E402"]
"./tests/*.py" = ["PLR2004"]
"./benchmarks/*.py" = ["PLR2004"]

[tool.pyright]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
include = ["./src"]
exclude = ["**/node_modules", "**/__pycache__"]
ignore = []
stubPath = "./stubs"
reportMissingImports = true
reportMissingTypeStubs = false
useLibraryCodeForTypes = true
typeCheckingMode = "strict"

[tool.pyrefly]
project_includes = ["./src"]
project_excludes = [
    "**/node_modules",
    "**/__pycache__",
]
python_version = "3.14"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["haiway*"]

[tool.setuptools.package-data]
haiway = ["py.typed", "**/*.pyi"]

# the source of the extension is in the source distribution, not in a wheel
[tool.setuptools.exclude-package-data]
"haiway._native" = ["*.c", "*.h"]

[tool.cibuildwheel]
# the extension is written against the GIL and is not built for a free-threaded
# interpreter, nor for the platforms nobody installs it on
build = "cp314-* cp315-*"
skip = "*-musllinux_i686 *-manylinux_i686 *-win32 *_ppc64le *_s390x *_riscv64"
build-frontend = "build[uv]"
environment = { HAIWAY_NATIVE = "1" }
# a file rather than a command line - the quoting of a multi-line one differs per shell
test-command = "python {project}/.github/wheel_smoke.py"
